name: build-test-package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a draft GitHub Release for this tag (must be v + the version in src/core/Version.h, e.g. v1.1.0) after all checks pass. Leave empty for a normal run."
        required: false
        default: ""

jobs:
  portable-core:
    name: Portable core (Linux) - unit tests + NSR trainer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Build NSR trainer
        run: g++ -std=c++17 -O2 -pthread -Ithird_party/stb tools/nsr_trainer/nsr_trainer.cpp -o build/nsr_trainer

  vs2022:
    name: Windows - Visual Studio 2022 compatibility build
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022
      - name: Configure (Visual Studio 17 2022 generator)
        run: cmake -S . -B build-vs -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build-vs --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build-vs -C Release --output-on-failure

  windows:
    name: Windows x64 - build, test, package
    runs-on: windows-latest
    permissions:
      contents: write   # draft release on v* tags only
    steps:
      - uses: actions/checkout@v6

      # Single source of truth for the version: src/core/Version.h
      - name: Read version
        shell: pwsh
        run: |
          $m = Select-String -Path src/core/Version.h -Pattern 'kVersionString = "([0-9]+\.[0-9]+\.[0-9]+)"'
          if (-not $m) { throw "version not found in src/core/Version.h" }
          $v = $m.Matches[0].Groups[1].Value
          "BGN_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version $v"
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag -and "${{ github.ref }}".StartsWith("refs/tags/v")) { $tag = "${{ github.ref_name }}" }
          if ($tag -and $tag -ne "v$v") { throw "release tag $tag does not match the app version v$v (src/core/Version.h)" }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel -- -k 0

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: GPU self-test (WARP software GPU on the CI runner)
        timeout-minutes: 25
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          $p = Start-Process -FilePath build\bin\BetterGFNNeural.exe -ArgumentList @('--selftest','--warp','--data-dir','build\selftest','--output','test-results\selftest.json') -Wait -PassThru
          Get-Content test-results\selftest.json
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed ($($p.ExitCode))" }

      - name: Benchmark (WARP)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\bin\BetterGFNNeural.exe -ArgumentList @('--benchmark','--warp','--data-dir','build\bench','--output','test-results\benchmark.json') -Wait -PassThru
          Get-Content test-results\benchmark.json
          if ($p.ExitCode -ne 0) { Write-Error "benchmark failed ($($p.ExitCode))" }

      - name: Integration tests (fake GeForce NOW)
        timeout-minutes: 15
        shell: pwsh
        run: ./tests/integration/run_integration.ps1 -Exe build\bin\BetterGFNNeural.exe -FakeGfn build\bin\FakeGfn.exe -OutDir test-results\integration

      - name: Show logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem build\selftest\logs, build\bench\logs -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "==== $($_.FullName)"; Get-Content $_.FullName }

      - name: Install NSIS
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Package (exe, portable zip, installer)
        if: always()
        shell: pwsh
        run: ./packaging/package.ps1 -BuildDir build -Version ${{ env.BGN_VERSION }}

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: BetterGFNNeural-${{ env.BGN_VERSION }}-windows-x64
          path: |
            dist/BetterGFNNeural.exe
            dist/BetterGFNNeuralSetup.exe
            dist/BetterGFNNeural-${{ env.BGN_VERSION }}-portable.zip
            dist/SHA256SUMS.txt

      # When a version tag (v*) is pushed, or a manual run names one in
      # release_tag: attach the packages to a draft GitHub Release so they do not
      # expire like workflow artifacts. A draft does not create the git tag yet;
      # GitHub creates it on this commit when the release is published.
      # Release notes: only this version's section of CHANGELOG.md
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($env:BGN_VERSION))\b" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $env:BGN_VERSION" }
          $out = @()
          for ($i = $start; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { break }; $out += $lines[$i] }
          $notes = @("Better GFN Neural $env:BGN_VERSION — unofficial GeForce NOW companion (not affiliated with NVIDIA).", "") + $out + @("", "Verify downloads with SHA256SUMS.txt.")
          $notes | Set-Content dist/RELEASE_NOTES.md -Encoding utf8

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Better GFN Neural ${{ inputs.release_tag || github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/BetterGFNNeural.exe
            dist/BetterGFNNeuralSetup.exe
            dist/BetterGFNNeural-${{ env.BGN_VERSION }}-portable.zip
            dist/SHA256SUMS.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            test-results/
            build/selftest/logs/
            build/bench/logs/
